[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-shield"
version = "6.1.0"
description = "Face-identity cloaking and Ed25519 provenance signing for photos, with an honest evaluation harness"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "facenet-pytorch>=2.5.2",
    "opencv-python>=4.8",
    "onnx>=1.15",
    "onnx2torch>=1.5",
    "cryptography>=41",
]

[project.optional-dependencies]
eval = ["onnxruntime>=1.16"]
test = ["pytest>=7", "onnxruntime>=1.16"]

[project.scripts]
deepfake-shield = "main:main"
dfs-provenance = "provenance.cli:main"
dfs-eval = "evaluation.run_eval:main"
dfs-weights = "scripts.download_weights:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["config*", "core*", "engine*", "models*", "utils*", "provenance*", "evaluation*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
