name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        # facenet-pytorch pins an old torch; install it without deps so the CPU wheel above is kept
        run: |
          pip install facenet-pytorch --no-deps
          pip install "Pillow>=10" "numpy>=1.24" opencv-python-headless onnx onnx2torch cryptography onnxruntime pytest requests tqdm

      - name: Run tests
        # Tests needing local model weights (face-swap check) skip themselves.
        run: python -m pytest -q
